; FastPhysics 1.0.7 diagnostic test build.
; A blank or mismatched executable hash keeps the solver hook OFF. This is intentional:
; after a game update, the new executable must be inspected and explicitly pinned first.

[FastPhysics]
Enabled=1
WarmStart=1
LogIntervalSeconds=5

; Compatibility gate: paste the exact SHA-256 of the ScrapMechanic.exe being tested.
; The first unpinned run only logs the hash and scans signatures; it does not patch or hook the game.
ExpectedGameExeSHA256=

; Extra byte-signature diagnostics. Relaxed matches are logged only and are NEVER patched.
DiagnoseSignatures=1

; Keep both optional game-code patches disabled during 1.0.7 validation.
ProbeSweepRadius=0
NavMeshFix=0

; Compare the first 512 solver calls against the game's own solver.
; If either solver fails, outputs differ beyond tolerance, or LCP validation fails,
; the vanilla answer is restored and FastPhysics is disabled for the rest of the process.
Verify=512
; Relative tolerance in parts per million (1000 = 0.001 = 0.1% of 1 + max |x|).
VerifyTolerancePPM=1000

; Keep all constraint sizes eligible, but use the original solver if a fast result fails checks.
MinRows=0
DumpFailures=0

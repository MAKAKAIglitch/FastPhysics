name: Windows build and tests

on:
  push:
    branches:
      - main
      - "hardening/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build loader and FastPhysics
        shell: cmd
        run: |
          call SMModLoader\build.bat
          if errorlevel 1 exit /b 1
          call build.bat
          if errorlevel 1 exit /b 1

      - name: Test mod loader
        shell: cmd
        run: |
          SMModLoader\build\LoaderTest.exe SMModLoader\bin\SMModLoader.dll SMModLoader\build\TestMod.dll
          if errorlevel 1 exit /b 1

      - name: Test solver and patch helpers
        shell: cmd
        run: |
          build\SelfTest.exe --solver-only
          if errorlevel 1 exit /b 1

      - name: Build and verify release archives
        shell: pwsh
        run: |
          ./package.ps1
          ./tests/VerifySourcePackage.ps1
